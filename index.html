<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darkfeline12</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    /* Header */
    header {
      background: #0a0a0a;
      color: #ffffff;
      padding: 20px 24px;
      border-bottom: 3px solid #0066cc;
    }
    header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      max-width: 1100px;
      margin: 0 auto;
    }
    header h1 span { color: #3b82f6; }

    /* Tabs Bar */
    nav {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
    }
    .tabs {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: none;
      border: none;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #111111;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
    }
    .tab-btn:hover { color: #0066cc; background: #eff6ff; }
    .tab-btn.active {
      color: #0066cc;
      border-bottom: 3px solid #0066cc;
      background: #ffffff;
    }

    /* Content */
    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .page { display: none; }
    .page.active { display: block; }
    .page h2 {
      font-size: 24px;
      color: #0a0a0a;
      padding-bottom: 10px;
      border-bottom: 2px solid #0066cc;
      display: inline-block;
    }
  </style>
</head>
<body>

  <header>
    <h1>DARK<span>FELINE12</span></h1>
  </header>

  <nav>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('home', this)">Home</button>
      <button class="tab-btn" onclick="showTab('body-mass', this)">Body Mass</button>
      <button class="tab-btn" onclick="showTab('robusticity', this)">Robusticity</button>
      <button class="tab-btn" onclick="showTab('strength', this)">Strength</button>
      <button class="tab-btn" onclick="showTab('comparison', this)">Comparison</button>
      <button class="tab-btn" onclick="showTab('morphology', this)">Morphology</button>
      <button class="tab-btn" onclick="showTab('biomechanics', this)">Biomechanics</button>
      <button class="tab-btn" onclick="showTab('stamina', this)">Stamina</button>
      <button class="tab-btn" onclick="showTab('fights', this)">Fights</button>
      <button class="tab-btn" onclick="showTab('studies', this)">Studies</button>
    </div>
  </nav>

  <main>
    <div id="home" class="page active"><h2>Home</h2></div>
    <div id="body-mass" class="page"><h2>Body Mass</h2></div>
    <div id="robusticity" class="page"><h2>Robusticity</h2></div>
    <div id="strength" class="page"><h2>Strength</h2></div>
    <div id="comparison" class="page"><h2>Comparison</h2></div>
    <div id="morphology" class="page"><h2>Morphology</h2></div>
    <div id="biomechanics" class="page"><h2>Biomechanics</h2></div>
    <div id="stamina" class="page"><h2>Stamina</h2></div>
    <div id="fights" class="page"><h2>Fights</h2></div>
    <div id="studies" class="page"><h2>Studies</h2></div>
  </main>

  <script>
    function showTab(id, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
      history.replaceState(null, null, '#' + id);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash.replace('#', '');
      const target = document.getElementById(hash);
      if (target) {
        const btn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.getAttribute('onclick').includes(hash));
        showTab(hash, btn);
      }
    });
  </script>

</body>
</html>
